<!doctype html><html><head><meta charset="utf-8"><title>AFNICA UI mockup</title>
<style>
body{margin:0;background:#020a10;color:#eaf7ff;font:14px Inter,system-ui,Arial,sans-serif}
.row{display:flex;gap:26px;justify-content:center;padding:18px 14px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.col h3{margin:0;font-size:15px;letter-spacing:.12em;color:#f2b33d}
.col small{opacity:.7;margin-top:-4px}
.phone{width:375px;height:760px;border:3px solid #25404c;border-radius:30px;overflow:hidden;background:#000;box-shadow:0 10px 40px #000a}
iframe{width:375px;height:760px;border:0;display:block}
</style></head><body>
<div class="row">
<div class="col"><h3>1 · HOME</h3><small>fishroom overview</small><div class="phone"><iframe data-k="home"></iframe></div></div>
<div class="col"><h3>2 · TANK</h3><small>no page scroll</small><div class="phone"><iframe data-k="tank"></iframe></div></div>
<div class="col"><h3>3 · BREEDING</h3><small>breeder · fry · info</small><div class="phone"><iframe data-k="breed"></iframe></div></div>
<div class="col"><h3>4 · PROGRESS</h3><small>quests + achievements</small><div class="phone"><iframe data-k="prog"></iframe></div></div>
</div>
<script src="mockup_ui121.js"></script></body></html>
