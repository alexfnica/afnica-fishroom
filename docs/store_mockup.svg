 <g id="plant"><path d="M0 0 Q-6 -30 -2 -58 Q6 -28 0 0Z M4 0 Q12 -26 20 -48 Q16 -20 6 0Z M-4 0 Q-18 -20 -26 -40 Q-14 -14 -2 0Z" fill="#3f9f3a"/><path d="M0 0 Q-2 -30 -2 -58" stroke="#7ee05a" stroke-width="1.5" fill="none"/></g>

